<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סל קניות על הדרך</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --ink: #1f2a24; --muted: #6b746e; --line: #e4ddd0;
  --brand: #1f7a54; --brand-ink: #ffffff; --brand-soft: #e3f1ea; --accent: #e8913a; --accent-soft: #fbeedd;
  --danger: #b4452f; --chip: #efe9dd; --shadow: 0 10px 30px rgba(31, 42, 36, .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121714; --panel: #1a211d; --ink: #e9eee9; --muted: #9aa59e; --line: #2b352f;
    --brand: #3fb784; --brand-ink: #0d1410; --brand-soft: #1d3329; --accent: #f0a457; --accent-soft: #3a2b1c;
    --danger: #e0735c; --chip: #242c27; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
}
:root[data-theme="dark"] {
  --bg: #121714; --panel: #1a211d; --ink: #e9eee9; --muted: #9aa59e; --line: #2b352f;
  --brand: #3fb784; --brand-ink: #0d1410; --brand-soft: #1d3329; --accent: #f0a457; --accent-soft: #3a2b1c;
  --danger: #e0735c; --chip: #242c27; --shadow: 0 10px 30px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 Heebo, system-ui, sans-serif; }
button, input, textarea { font: inherit; color: inherit; }

.app { display: grid; grid-template-columns: minmax(360px, 480px) 1fr; height: 100vh; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
header { padding: 20px 24px 14px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 21px; letter-spacing: -.01em; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); color: var(--brand-ink);
        display: grid; place-items: center; font-size: 18px; }
.sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.feed { flex: 1; overflow-y: auto; padding: 18px 24px 24px; display: flex; flex-direction: column; gap: 14px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.bubble { align-self: flex-start; max-width: 92%; background: var(--brand); color: var(--brand-ink);
          padding: 10px 14px; border-radius: 16px 16px 4px 16px; font-weight: 500; }
.bubble.small { font-size: 14px; opacity: .92; }
.label { font-size: 13px; color: var(--muted); font-weight: 500; margin-bottom: 8px; }
h3 { margin: 0 0 6px; font-size: 17px; }

textarea { width: 100%; min-height: 96px; resize: vertical; border: 1px solid var(--line); background: var(--bg);
           border-radius: 12px; padding: 12px; outline: none; }
textarea:focus, input[type=text]:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
input[type=text] { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 2px; }
.chip { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; text-align: right; }
.chip:hover { border-color: var(--brand); }
.row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
.btn { border: 0; border-radius: 12px; padding: 10px 18px; font-weight: 700; cursor: pointer; background: var(--brand); color: var(--brand-ink); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.accent { background: var(--accent); color: #1b1208; }
.spacer { flex: 1; }

.opt { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: right; cursor: pointer;
       border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-top: 8px; }
.opt:hover { border-color: var(--brand); }
.opt.sel { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.opt small { color: var(--muted); display: block; }
.price { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
.reason { color: var(--muted); font-size: 14px; margin: 2px 0 6px; }
.q + .q { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); }
.check { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--muted); margin-top: 8px; }

.loading { display: flex; gap: 12px; align-items: center; color: var(--muted); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); animation: b 1s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes b { 0%, 80%, 100% { transform: scale(.5); opacity: .4 } 40% { transform: scale(1); opacity: 1 } }

.hero { background: linear-gradient(135deg, var(--brand), color-mix(in srgb, var(--brand) 70%, #0a3d28)); color: var(--brand-ink);
        border: 0; }
.hero .label { color: inherit; opacity: .85; }
.total { font-size: 38px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.store-name { font-size: 18px; font-weight: 700; margin-top: 4px; }
.meta { font-size: 14px; opacity: .9; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.hero .pill { background: rgba(255,255,255,.18); color: inherit; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.num { text-align: left; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
.x { color: var(--danger); }
.cmp { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.cmp:last-child { border-bottom: 0; }
.cmp .d { color: var(--muted); font-size: 13px; }
.warn { background: var(--accent-soft); color: var(--ink); border-color: transparent; font-size: 14px; }
.err { border-color: var(--danger); color: var(--danger); }
details summary { cursor: pointer; color: var(--muted); font-size: 14px; }
pre { white-space: pre-wrap; font: 13px/1.5 Heebo, sans-serif; color: var(--muted); }

.mapwrap { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--bg); }
.legend { position: absolute; z-index: 500; bottom: 18px; right: 18px; background: var(--panel); border: 1px solid var(--line);
          border-radius: 12px; padding: 10px 12px; font-size: 13px; box-shadow: var(--shadow); display: grid; gap: 4px; }
.legend span { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-left: 6px; vertical-align: -1px; }
.theme { position: absolute; z-index: 500; top: 14px; left: 14px; }
.leaflet-container { font-family: Heebo, sans-serif; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 42vh; height: auto; }
  .side { border-left: 0; order: 1; }
  .mapwrap { order: 2; height: 42vh; }
  header, .feed { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <header>
      <div class="brand"><div class="logo">🛒</div>סל קניות על הדרך</div>
      <div class="sub">מחירים אמיתיים מרשתות השיווק, רק בסניפים שבדרך שלך · בני ברק</div>
    </header>
    <div class="feed" id="feed"></div>
  </aside>
  <main class="mapwrap">
    <div id="map"></div>
    <button class="btn ghost theme" id="theme" title="מצב תצוגה">◐</button>
    <div class="legend">
      <div><span style="background:var(--brand)"></span>הסניף המומלץ</div>
      <div><span style="background:var(--accent)"></span>סניפים להשוואה</div>
      <div><span style="background:#8a948e"></span>חנויות בלי נתוני מחירים</div>
      <div><span style="background:#3b82f6"></span>הדרך שלך</div>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const CHAINS = {
  SHUFERSAL: "שופרסל", RAMI_LEVY: "רמי לוי", OSHER_AD: "אושר עד", SHUK_AHIR: "שוק העיר", MAAYAN_2000: "מעיין 2000",
  SHEFA_BARCART_ASHEM: "שפע ברכת השם", GOOD_PHARM: "גוד פארם", SUPER_PHARM: "סופר־פארם", YOHANANOF: "יוחננוף",
  HAZI_HINAM: "חצי חינם", VICTORY_NEW_SOURCE: "ויקטורי", KING_STORE: "קינג סטור", SUPER_SAPIR: "סופר ספיר",
};
const EXAMPLES = [
  "הולך בכהנמן מ-60 עד 110. צריך חלב, קוטג', לחם ו-12 ביצים",
  "אני גר בז'בוטינסקי 160. צריך חלב 3%, גבינה לבנה, אורז ושמן",
  "הולך מהרב הירש לכהנמן פינת פוברסקי, צריך שתייה מתוקה של ליטר ומסטיקים",
];
const STAGES = ["מבין את הבקשה…", "מאתר את הדרך במפה…", "מחפש את המוצרים…", "משווה מחירים בסניפים שבדרך…", "בודק חנויות נוספות באזור…"];

const feed = document.getElementById("feed");
let threadId = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => (n == null ? "—" : `${Number(n).toFixed(2)} ₪`);
const store = label => {
  const [chain, ...rest] = String(label).split(" - ");
  const tail = rest.join(" - ");
  return { chain: CHAINS[chain] || chain, branch: tail.replace(/\s*\(.*\)\s*$/, ""), address: (tail.match(/\(([^)]*)\)\s*$/) || [])[1] || "" };
};
const el = html => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
const add = node => { feed.appendChild(node); node.scrollIntoView({ behavior: "smooth", block: "end" }); return node; };

// ---------- theme ----------
document.getElementById("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", document.documentElement.dataset.theme); } catch (e) {}
  setTiles();
};
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

// ---------- map ----------
const map = L.map("map", { zoomControl: true }).setView([32.0849, 34.8338], 14);
// Esri's gray canvas: streets and names only, no icons (no hospital crosses), so only our markers stand out.
// Free without a key. Base = streets, Reference = the labels layer above it.
const isDark = () => document.documentElement.dataset.theme
  ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
let tiles = [];
function setTiles() {
  tiles.forEach(t => t.remove());
  const shade = isDark() ? "Dark_Gray" : "Light_Gray";
  const esri = part => L.tileLayer(
    `https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${shade}_${part}/MapServer/tile/{z}/{y}/{x}`,
    { maxZoom: 19, maxNativeZoom: 16, attribution: "© Esri, HERE, Garmin, © OpenStreetMap" });
  tiles = [esri("Base").addTo(map), esri("Reference").addTo(map)];
}
setTiles();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", setTiles);
let layer = L.layerGroup().addTo(map);
const dot = (p, color, r, html) => L.circleMarker(p, { radius: r, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1 }).bindPopup(html);

function drawMap(res) {
  layer.clearLayers();
  const bounds = [];
  for (const segs of res.map.parts) for (const [a, b] of segs) {
    L.polyline([a, b], { color: "#3b82f6", weight: 6, opacity: .75, lineCap: "round" }).addTo(layer);
    bounds.push(a, b);
  }
  for (const s of res.map.spots) {
    L.circle(s.point, { radius: s.radius, color: "#3b82f6", weight: 1, fillOpacity: .06 }).addTo(layer);
    L.circleMarker(s.point, { radius: 5, color: "#3b82f6", fillColor: "#3b82f6", fillOpacity: 1 }).bindTooltip(esc(s.label)).addTo(layer);
    bounds.push(s.point);
  }
  for (const s of res.other_shops) if (s.point) dot(s.point, "#8a948e", 6, `<b>${esc(s.name)}</b><br>${esc(s.note)}`).addTo(layer);
  for (const s of [...res.stores].reverse()) if (s.point) {
    const st = store(s.label), chosen = s.role === "chosen";
    const m = dot(s.point, chosen ? getComputedStyle(document.documentElement).getPropertyValue("--brand") : "#e8913a", chosen ? 11 : 8,
      `<b>${esc(st.chain)} · ${esc(st.branch)}</b><br>${esc(st.address)}<br><b>${money(s.total)}</b>`).addTo(layer);
    if (chosen) m.openPopup();
    bounds.push(s.point);
  }
  if (bounds.length) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
}

// ---------- api ----------
async function call(path, body) {
  const wait = add(el(`<div class="card loading"><span class="dots"><i></i><i></i><i></i></span><span id="stage">${STAGES[0]}</span></div>`));
  let k = 0;
  const timer = setInterval(() => { k = Math.min(k + 1, STAGES.length - 1); wait.querySelector("#stage").textContent = STAGES[k]; }, 3500);
  try {
    const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    threadId = data.thread_id;
    data.type === "question" ? ask(data.payload) : done(data.result);
  } catch (e) {
    add(el(`<div class="card err"><b>משהו השתבש.</b><br>${esc(e.message)}<div class="row"><button class="btn ghost">להתחיל מחדש</button></div></div>`))
      .querySelector("button").onclick = start;
  } finally { clearInterval(timer); wait.remove(); }
}
const resume = (value, said) => { if (said) add(el(`<div class="bubble small">${esc(said)}</div>`)); call("/api/resume", { thread_id: threadId, resume: value }); };

// ---------- start ----------
function start() {
  feed.innerHTML = ""; layer.clearLayers(); threadId = null;
  const card = add(el(`<div class="card">
    <h3>איפה אתה, ומה צריך לקנות?</h3>
    <div class="reason">כתובת, רחוב שאתה הולך בו, או מאיפה לאיפה. ואחר כך רשימת הקניות.</div>
    <textarea id="req" placeholder="לדוגמה: הולך בכהנמן מ-60 עד 110. צריך חלב, קוטג' ולחם"></textarea>
    <div class="chips">${EXAMPLES.map(x => `<button class="chip">${esc(x)}</button>`).join("")}</div>
    <div class="row"><span class="spacer"></span><button class="btn" id="go">חפש לי את הסל הזול</button></div>
  </div>`));
  const ta = card.querySelector("#req");
  card.querySelectorAll(".chip").forEach(c => c.onclick = () => { ta.value = c.textContent; ta.focus(); });
  const go = () => {
    const text = ta.value.trim(); if (!text) return ta.focus();
    card.remove(); add(el(`<div class="bubble">${esc(text)}</div>`)); call("/api/start", { request: text });
  };
  card.querySelector("#go").onclick = go;
  ta.onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) go(); };
  ta.focus();
}

// ---------- the agent's questions ----------
function ask(p) {
  ({ fix_places: askPlaces, choose_products: askProducts, cheap_vs_near: askCheapNear, confirm_split: askSplit })[p.type](p);
}

function askPlaces(p) {
  if (p.questions[0]?.kind === "network") {  // nothing to type: the map server didn't answer, try it again
    const card = add(el(`<div class="card warn"><div class="label">📡 בעיית תקשורת</div><h3>${esc(p.questions[0].question)}</h3>
      <div class="row"><button class="btn ghost" id="skip">המשך בלי מיקום</button><span class="spacer"></span><button class="btn" id="retry">נסה שוב</button></div></div>`));
    card.querySelector("#retry").onclick = () => { card.remove(); resume([{ issue: 0, text: "retry" }], "נסה שוב"); };
    card.querySelector("#skip").onclick = () => { card.remove(); resume([], "המשך בלי מיקום"); };
    return;
  }
  const card = add(el(`<div class="card"><div class="label">📍 צריך עזרה עם המיקום</div>
    ${p.questions.map((q, i) => `<div class="q"><h3>${esc(q.question)}</h3><input type="text" data-i="${q.issue}" placeholder="למשל: כהנמן 69, או רחוב ופינה"></div>`).join("")}
    <div class="row"><button class="btn ghost" id="skip">דלג</button><span class="spacer"></span><button class="btn" id="ok">המשך</button></div></div>`));
  const inputs = [...card.querySelectorAll("input")];
  inputs[0]?.focus();
  const send = all => {
    const answers = all ? inputs.filter(x => x.value.trim()).map(x => ({ issue: +x.dataset.i, text: x.value.trim() })) : [];
    card.remove(); resume(answers, answers.map(a => a.text).join(" · ") || "דילגתי");
  };
  inputs.forEach(x => x.onkeydown = e => { if (e.key === "Enter") send(true); });
  card.querySelector("#ok").onclick = () => send(true);
  card.querySelector("#skip").onclick = () => send(false);
}

function askProducts(p) {
  const card = add(el(`<div class="card"><div class="label">❓ כמה מוצרים לא ברורים - בחר, דלג או כתוב אחרת</div>
    ${p.questions.map(q => `<div class="q" data-index="${q.index}">
      <h3>${esc(q.text)}</h3><div class="reason">${esc(q.reason)}</div>
      ${q.options.map(o => `<button class="opt" data-code="${esc(o.item_code)}"><span>${esc(o.name)}<small>${esc(o.manufacturer || "")}</small></span><span class="price">מ-${money(o.min_price)}</span></button>`).join("")}
      <input type="text" placeholder="${q.options.length ? "או כתוב ניסוח אחר…" : "כתוב ניסוח אחר, או השאר ריק לדילוג"}" style="margin-top:8px">
      ${q.options.length ? `<label class="check"><input type="checkbox"> לזכור את הבחירה לפעם הבאה</label>` : ""}
    </div>`).join("")}
    <div class="row"><span class="spacer"></span><button class="btn" id="ok">המשך</button></div></div>`));
  card.querySelectorAll(".q").forEach(q => {
    const opts = q.querySelectorAll(".opt"), text = q.querySelector("input[type=text]");
    opts.forEach(o => o.onclick = () => { opts.forEach(x => x.classList.toggle("sel", x === o && !o.classList.contains("sel"))); text.value = ""; });
    text.oninput = () => opts.forEach(x => x.classList.remove("sel"));
  });
  card.querySelector("#ok").onclick = () => {
    const said = [];
    const answers = [...card.querySelectorAll(".q")].map(q => {
      const index = +q.dataset.index, sel = q.querySelector(".opt.sel"), text = q.querySelector("input[type=text]").value.trim();
      if (sel) { said.push(sel.querySelector("span").firstChild.textContent); return { index, pick: sel.dataset.code, remember: !!q.querySelector("input[type=checkbox]")?.checked }; }
      if (text) { said.push(text); return { index, retype: text }; }
      said.push("דילוג"); return { index, skip: true };
    });
    card.remove(); resume(answers, said.join(" · "));
  };
}

function askCheapNear(p) {
  const b = store(p.best.label), n = store(p.nearest.label), save = p.nearest.compare - p.best.compare;
  const card = add(el(`<div class="card"><div class="label">⚖️ זול או קרוב?</div>
    <h3>הזול חוסך ${money(save)}, אבל רחוק יותר</h3>
    <button class="opt" data-v="cheap"><span>💰 ${esc(b.chain)} · ${esc(b.branch)}<small>${p.best.distance} מ' מ${esc(p.best.from)}</small></span><span class="price">${money(p.best.total)}</span></button>
    <button class="opt" data-v="near"><span>🚶 ${esc(n.chain)} · ${esc(n.branch)}<small>${p.nearest.distance} מ' מ${esc(p.nearest.from)}</small></span><span class="price">${money(p.nearest.total)}</span></button>
  </div>`));
  card.querySelectorAll(".opt").forEach(o => o.onclick = () => { card.remove(); resume(o.dataset.v, o.dataset.v === "cheap" ? "הולך לזול" : "הולך לקרוב"); });
}

function askSplit(p) {
  const card = add(el(`<div class="card"><div class="label">🛍️ שתי חנויות?</div>
    <h3>בשתי חנויות תחסוך ${money(p.split.saving)}</h3>
    <div class="reason">בחנות אחת: ${money(p.best.total)} · בשתיים: ${money(p.split.total)}</div>
    ${p.split.parts.map(x => { const s = store(x.store); return `<div class="cmp"><span>${esc(s.chain)} · ${esc(s.branch)}</span><span class="d">${x.items.length} מוצרים</span></div>`; }).join("")}
    <div class="row"><button class="btn ghost" id="no">חנות אחת מספיקה</button><span class="spacer"></span><button class="btn accent" id="yes">שווה לי, שתי חנויות</button></div></div>`));
  card.querySelector("#yes").onclick = () => { card.remove(); resume(true, "שתי חנויות"); };
  card.querySelector("#no").onclick = () => { card.remove(); resume(false, "חנות אחת"); };
}

// ---------- the answer ----------
// stores are compared for the same amounts; when a store sells a different package size, say so
const sameAmount = s => Math.abs(s.compare - s.total) >= 0.01 ? `לאותה כמות: ${money(s.compare)}` : "";

function done(res) {
  drawMap(res);
  if (res.description) add(el(`<div class="card"><div class="label">📍 הדרך שלך</div><div>${esc(res.description)}</div>
    ${res.route_warnings.map(w => `<div class="reason" style="margin-top:6px">⚠️ ${esc(w)}</div>`).join("")}</div>`));
  else add(el(`<div class="card warn">לא ציינת מיקום שנמצא במפה, אז השוויתי בין כל הסניפים בעיר.</div>`));
  if (res.too_many) add(el(`<div class="card warn">⚠️ ${esc(res.too_many)}</div>`));
  if (!res.on_the_way) add(el(`<div class="card warn">אין על הדרך סניפים עם נתוני מחירים. אלה הקרובים ביותר.</div>`));

  const chosen = res.stores.find(s => s.role === "chosen");
  if (chosen) {
    const s = store(chosen.label);
    add(el(`<div class="card hero"><div class="label">🛒 ההמלצה</div>
      <div class="total">${money(chosen.total)}</div>
      ${sameAmount(chosen) ? `<div class="meta">${sameAmount(chosen)}</div>` : ""}
      <div class="store-name">${esc(s.chain)} · ${esc(s.branch)}</div>
      <div class="meta">${esc(s.address)}${chosen.distance != null ? ` · ${chosen.distance} מ' מ${esc(chosen.from)}` : ""}</div>
      ${chosen.missing.length ? `<div style="margin-top:8px"><span class="pill">חסרים כאן ${chosen.missing.length} מוצרים</span></div>` : ""}
    </div>`));
  } else add(el(`<div class="card warn">לא נמצאו מוצרים לחישוב סל.</div>`));

  add(el(`<div class="card"><div class="label">הסל${chosen ? " בסניף המומלץ" : ""}</div><table>
    ${res.items.map(i => i.status === "match"
      ? `<tr><td>${esc(i.name)}<br><small style="color:var(--muted)">${/\p{L}/u.test(i.manufacturer || "") ? esc(i.manufacturer) + " · " : ""}ביקשת: ${esc(i.text)}${i.quantity > 1 ? ` · ×${i.quantity}` : ""}</small></td><td class="num">${i.line_total != null ? money(i.line_total) : '<span class="x">אין בסניף</span>'}</td></tr>`
      : `<tr><td class="x">✗ ${esc(i.text)}<br><small style="color:var(--muted)">${esc(i.reason)}</small></td><td class="num">—</td></tr>`).join("")}
  </table></div>`));

  if (res.elsewhere.length) add(el(`<div class="card warn"><div class="label">⚠️ חסרים בסניף המומלץ</div>
    ${res.elsewhere.map(e => `<div class="cmp"><span><b>${esc(e.text)}</b><br><span class="d">${e.store
      ? `אפשר לקנות ב: ${esc(store(e.store).chain)} · ${esc(store(e.store).branch)}` : "לא נמכר באף סניף עם נתוני מחירים"}</span></span>
      <span class="d">${e.distance == null ? "" : e.distance === 0 ? "על הדרך" : `${e.distance} מ' מהדרך`}</span></div>`).join("")}</div>`));

  if (res.split) add(el(`<div class="card"><div class="label">קנייה בשתי חנויות · ${money(res.split.total)}</div>
    ${res.split.parts.map(x => { const s = store(x.store); return `<div class="cmp"><span><b>${esc(s.chain)} · ${esc(s.branch)}</b><br><span class="d">${esc(x.items.join(", "))}</span></span></div>`; }).join("")}</div>`));

  const others = res.stores.filter(s => s.role !== "chosen");
  if (others.length) add(el(`<div class="card"><div class="label">השוואה לסניפים אחרים בדרך</div>
    ${others.map(o => { const s = store(o.label), diff = chosen ? o.compare - chosen.compare : 0;
      return `<div class="cmp"><span>${esc(s.chain)} · ${esc(s.branch)}<br><span class="d">${o.distance != null ? `${o.distance} מ' מ${esc(o.from)}` : esc(s.address)}${o.missing.length ? ` · חסרים ${o.missing.length}` : ""}${sameAmount(o) ? ` · ${sameAmount(o)}` : ""}</span></span>
        <span class="price">${money(o.total)}${diff > 0 ? `<br><span class="d">+${diff.toFixed(2)}</span>` : ""}</span></div>`; }).join("")}</div>`));

  if (res.other_shops.length) add(el(`<div class="card"><div class="label">🏪 חנויות נוספות בדרך, בלי נתוני מחירים</div>
    ${res.other_shops.map(s => `<div class="cmp"><span><b>${esc(s.name)}</b>${s.address ? ` · ${esc(s.address)}` : ""}<br><span class="d">${esc(s.note)}</span></span><span class="d">${s.distance} מ'</span></div>`).join("")}</div>`));

  add(el(`<div class="card"><details><summary>התשובה המלאה כטקסט (כמו בטרמינל)</summary><pre>${esc(res.answer_text)}</pre></details>
    <div class="row"><span class="spacer"></span><button class="btn">חיפוש חדש</button></div></div>`)).querySelector(".btn").onclick = start;
}

start();
</script>
</body>
</html>
